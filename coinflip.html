<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coin Flip — Hackathon Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="header.js" defer></script>
    <style>
      body { background: #f5f0e8; }
      .coin-scene {
        perspective: 600px;
        width: 120px;
        height: 120px;
      }
      .coin {
        width: 120px;
        height: 120px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.9s ease;
        cursor: pointer;
      }
      .coin-face {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        backface-visibility: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: bold;
        background: #fff;
        border: 2px solid #ccc;
        color: #333;
        user-select: none;
      }
      .coin-tails {
        transform: rotateY(180deg);
      }
    </style>
  </head>
  <body class="bg-[#f5f0e8] min-h-screen">
    <site-header></site-header>
    <div class="max-w-xs mx-auto px-5 pt-12 pb-16 flex flex-col items-center gap-6">

      <div class="coin-scene">
        <div class="coin" id="coin">
          <div class="coin-face coin-heads">H</div>
          <div class="coin-face coin-tails">T</div>
        </div>
      </div>

      <p id="result-text" class="text-lg text-gray-400">—</p>

      <div class="flex gap-6 text-center text-sm text-gray-500">
        <div>
          <div id="heads-count" class="text-xl font-bold text-gray-800">0</div>
          <div>Heads</div>
        </div>
        <div>
          <div id="tails-count" class="text-xl font-bold text-gray-800">0</div>
          <div>Tails</div>
        </div>
        <div>
          <div id="streak-count" class="text-xl font-bold text-gray-800">0</div>
          <div id="streak-label">Streak</div>
        </div>
      </div>

      <button id="flip-btn" class="px-8 py-2 border border-gray-400 rounded text-gray-700 hover:bg-gray-100 active:scale-95 transition-colors">
        Flip
      </button>

    </div>

    <script>
      let totalDeg = 0;
      let headsCount = 0;
      let tailsCount = 0;
      let streak = 0;
      let lastResult = null;
      let isFlipping = false;

      const coin = document.getElementById('coin');
      const resultText = document.getElementById('result-text');
      const headsEl = document.getElementById('heads-count');
      const tailsEl = document.getElementById('tails-count');
      const streakEl = document.getElementById('streak-count');
      const streakLabel = document.getElementById('streak-label');
      const flipBtn = document.getElementById('flip-btn');

      function doFlip() {
        if (isFlipping) return;
        isFlipping = true;
        flipBtn.disabled = true;
        resultText.textContent = '—';
        resultText.style.color = '';

        const isHeads = Math.random() < 0.5;
        const halfTurns = Math.floor(Math.random() * 4) + 8;
        const currentHalf = Math.round(totalDeg / 180);
        let targetHalf = currentHalf + halfTurns;
        if ((targetHalf % 2 === 0) !== isHeads) targetHalf++;
        totalDeg = targetHalf * 180;
        coin.style.transform = `rotateY(${totalDeg}deg)`;

        setTimeout(() => {
          isFlipping = false;
          flipBtn.disabled = false;

          if (isHeads) {
            headsCount++;
            headsEl.textContent = headsCount;
            resultText.textContent = 'Heads';
          } else {
            tailsCount++;
            tailsEl.textContent = tailsCount;
            resultText.textContent = 'Tails';
          }

          const thisResult = isHeads ? 'heads' : 'tails';
          streak = lastResult === thisResult ? streak + 1 : 1;
          lastResult = thisResult;
          streakEl.textContent = streak;
          streakLabel.textContent = streak > 1 ? (isHeads ? 'H streak' : 'T streak') : 'Streak';
        }, 950);
      }

      flipBtn.addEventListener('click', doFlip);
      coin.addEventListener('click', doFlip);
    </script>
  </body>
</html>
